name: CI

on:
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asistencia_test
          POSTGRES_USER: asistencia
          POSTGRES_PASSWORD: password_solo_para_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asistencia -d asistencia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: asistencia_test
      POSTGRES_USER: asistencia
      POSTGRES_PASSWORD: password_solo_para_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: clave-solo-para-ci
      DJANGO_DEBUG: "False"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pytest
        run: pytest